[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbdac"
version = "0.1.0"
description = "Simulator-independent model-based differentiable actor-critic for robotics"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dependencies = ["torch>=2.6", "numpy>=1.24", "tensordict>=0.7"]

[project.optional-dependencies]
mjlab = ["mjlab==1.2.0", "mujoco==3.8.1", "mujoco-warp==3.8.1", "warp-lang==1.12.0", "scipy==1.17.0"]
wandb = ["wandb>=0.25"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
